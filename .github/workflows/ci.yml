name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        shell: bash
        run: for f in bin/*.mjs lib/*.mjs hooks/*.mjs hooks/codex/*.mjs; do node --check "$f"; done

      - name: Tests
        run: npm test

      - name: Smoke — CLI and dry-runs against the runner's real home
        shell: bash
        run: |
          node bin/cli.mjs --version
          node bin/install.mjs --dry-run --with-all
          node bin/ingest-sessions.mjs --all --dry-run

  package:
    name: npm package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack (dry-run)
        run: npm pack --dry-run
