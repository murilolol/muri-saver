<rect x="380" y="630" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="398" y="640" fill="#4f5d75" font-size="9" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif">Processamento (hooks)</text>

<rect x="560" y="630" width="12" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="578" y="640" fill="#4f5d75" font-size="9" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif">Cliente de IA</text>

<rect x="680" y="630" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="698" y="640" fill="#4f5d75" font-size="9" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif">Armazenamento</text>

