<text x="400" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,monospace" text-anchor="middle">CLAUDE.md · AGENTS.md · GEMINI.md + skill muri-saver</text>
<text x="400" y="232" fill="#7a8399" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,monospace" text-anchor="middle" letter-spacing="0.02em">sempre carregado · sob demanda · renomeável via --alias</text>

<rect x="100" y="330" width="260" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="230" y="362" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">Hooks de ciclo de vida</text>
<text x="230" y="378" fill="#4f5d75" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,monospace" text-anchor="middle">SessionStart -&gt; Stop · sessões novas</text>
<text x="230" y="392" fill="#7a8399" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,monospace" text-anchor="middle">vault e fuso via muri-saver.json</text>

<rect x="440" y="330" width="260" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="570" y="362" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">Ingestor de sessões</text>
<text x="570" y="378" fill="#4f5d75" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,monospace" text-anchor="middle">bin/ingest-sessions.mjs · histórico</text>
<text x="570" y="392" fill="#7a8399" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,monospace" text-anchor="middle">sem LLM por padrão · --enrich opcional</text>

<rect x="100" y="500" width="260" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="230" y="534" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">ai-memory</text>
<text x="230" y="550" fill="#4f5d75" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,monospace" text-anchor="middle">SQLite + FTS5 · MCP local</text>

<rect x="440" y="500" width="260" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="570" y="534" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">Obsidian Vault</text>
<text x="570" y="550" fill="#4f5d75" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,monospace" text-anchor="middle">dailies · sessions · projects/&lt;projeto&gt;</text>

