<svg viewBox="0 0 820 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="muri-saver-arch-title muri-saver-arch-desc">
<title id="muri-saver-arch-title">Arquitetura do muri-saver v2</title>
<desc id="muri-saver-arch-desc">Claude Code, Codex e Antigravity carregam cada um seu arquivo de governanca (CLAUDE.md, AGENTS.md, GEMINI.md) e a skill muri-saver. Os hooks de ciclo de vida gravam cada sessao nova no ai-memory e no Obsidian Vault, lendo vault e fuso do muri-saver.json. O ingestor de sessoes le o historico local dos tres agentes e grava retroativamente nos mesmos destinos, sem LLM por padrão. O ai-memory alimenta o vault.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
  </marker>
</defs>

<rect width="820" height="680" fill="#f5f5f5"/>

<!-- ============ ARROWS ============ -->
<path d="M 120,104 V 204 Q 120,212 128,212 H 180" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 400,104 V 168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 680,104 V 204 Q 680,212 672,212 H 620" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- historico local -> ingestor (dashed) -->
<path d="M 760,72 H 782 Q 790,72 790,80 V 362 Q 790,370 782,370 H 700" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<rect x="712" y="352" width="72" height="12" rx="2" fill="#f5f5f5"/>
<text x="748" y="361" fill="#7a8399" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,monospace" text-anchor="middle" letter-spacing="0.04em">HISTÓRICO</text>

<!-- governanca -> hooks -->
<path d="M 230,256 V 330" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- hooks -> ai-memory / hooks -> vault -->
<path d="M 200,410 V 500" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 290,410 V 446 Q 290,454 298,454 H 532 Q 540,454 540,462 V 500" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="504" y="449" width="12" height="10" fill="#f5f5f5"/>

<!-- ingestor -> vault / ingestor -> ai-memory -->
<path d="M 600,410 V 500" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 510,410 V 468 Q 510,476 502,476 H 268 Q 260,476 260,484 V 500" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- ai-memory -> vault -->
<path d="M 360,540 H 440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="376" y="520" width="48" height="12" rx="2" fill="#f5f5f5"/>
<text x="400" y="529" fill="#7a8399" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,monospace" text-anchor="middle" letter-spacing="0.06em">ALIMENTA</text>

<!-- ============ NODES ============ -->
<rect x="40" y="40" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="120" y="70" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">Claude Code</text>
<text x="120" y="86" fill="#4f5d75" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,monospace" text-anchor="middle">~/.claude</text>

<rect x="320" y="40" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
