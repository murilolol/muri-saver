<text x="400" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,monospace" text-anchor="middle">SessionStart -&gt; Stop</text>

<!-- ai-memory (focal) -->
<rect x="168" y="520" width="200" height="80" rx="6" fill="#f5f5f5"/>
<rect x="168" y="520" width="200" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="268" y="554" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">ai-memory</text>
<text x="268" y="570" fill="#4f5d75" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,monospace" text-anchor="middle">SQLite + FTS5 · MCP local</text>

<!-- Obsidian Vault (store) -->
<rect x="432" y="520" width="200" height="80" rx="6" fill="#f5f5f5"/>
<rect x="432" y="520" width="200" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="532" y="554" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">Obsidian Vault</text>
<text x="532" y="570" fill="#4f5d75" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,monospace" text-anchor="middle">Markdown · leitura humana</text>

