<svg viewBox="0 0 800 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="muri-saver-arch-title muri-saver-arch-desc">
<title id="muri-saver-arch-title">Arquitetura do muri-saver</title>
<desc id="muri-saver-arch-desc">Claude Code, Codex e Antigravity alimentam uma camada de governanca (CLAUDE.md e a skill muri-saver), que aciona hooks de ciclo de vida no inicio e no fim de cada sessao; os hooks gravam no banco durvavel ai-memory e no vault do Obsidian, e o ai-memory por sua vez alimenta o vault.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
  </marker>
</defs>

<rect width="800" height="660" fill="#f5f5f5"/>

<!-- ============ ARROWS (drawn before nodes) ============ -->

<!-- Claude Code -> Governanca -->
<path d="M 120,104 H 212 Q 220,104 220,112 V 176 Q 220,184 228,184 H 320"
      fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Codex -> Governanca (straight, same x) -->
<path d="M 400,104 V 184" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Antigravity -> Governanca -->
<path d="M 680,104 H 588 Q 580,104 580,112 V 176 Q 580,184 572,184 H 480"
      fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Governanca -> Hooks (straight, same x) -->
<path d="M 400,280 V 360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Hooks -> ai-memory -->
<path d="M 380,440 H 332 Q 324,440 324,448 V 512 Q 324,520 316,520 H 268"
      fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Hooks -> Obsidian Vault -->
<path d="M 420,440 H 468 Q 476,440 476,448 V 512 Q 476,520 484,520 H 532"
      fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- ai-memory -> Obsidian Vault (straight, same y) -->
<path d="M 368,560 H 432" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="376" y="540" width="48" height="12" rx="2" fill="#f5f5f5"/>
<text x="400" y="549" fill="#7a8399" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,monospace"
      text-anchor="middle" letter-spacing="0.06em">ALIMENTA</text>

<!-- ============ NODES ============ -->

<!-- Claude Code (input) -->
<rect x="40" y="40" width="160" height="64" rx="6" fill="#f5f5f5"/>
<rect x="40" y="40" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="120" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">Claude Code</text>

<!-- Codex (input) -->
<rect x="320" y="40" width="160" height="64" rx="6" fill="#f5f5f5"/>
<rect x="320" y="40" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="400" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">Codex</text>

<!-- Antigravity (input) -->
<rect x="600" y="40" width="160" height="64" rx="6" fill="#f5f5f5"/>
<rect x="600" y="40" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="680" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">Antigravity</text>

<!-- Governanca (focal) -->
