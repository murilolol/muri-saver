<rect x="240" y="184" width="320" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="400" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">Governanca</text>
<text x="400" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,monospace" text-anchor="middle">CLAUDE.md + Skill muri-saver</text>
<text x="400" y="254" fill="#7a8399" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,monospace" text-anchor="middle" letter-spacing="0.02em">sempre carregado · sob demanda</text>

