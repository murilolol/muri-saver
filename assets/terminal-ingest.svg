  <text x="18" y="83" xml:space="preserve"><tspan fill="#c9d1d9">[ingest-sessions] SO: darwin — fuso: America/Sao_Paulo — vault: ~/Documents/Obsidian Vault</tspan></text>
  <text x="18" y="102" xml:space="preserve"><tspan fill="#c9d1d9">[ingest-sessions] --enrich ativo: até 1 sessão(ões) substanciais por rodada, teto de US$ 0.20 por chamada (claude-haiku-4-5-20251001).</tspan></text>
  <text x="18" y="121" xml:space="preserve"><tspan fill="#c9d1d9">[ingest-sessions] claude: 1 sessão(ões) — 1 de subagentes puladas (--include-subagents inclui)</tspan></text>
  <text x="18" y="140" xml:space="preserve"><tspan fill="#c9d1d9">[ingest-sessions] antigravity: 1 sessão(ões)</tspan></text>
