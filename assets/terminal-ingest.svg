  <text x="18" y="197" xml:space="preserve"><tspan fill="#c9d1d9">[ingest-sessions]   [claude] 0f1e2d3c ✨ — vault -&gt; Session-2026-09-20_10h00-Claude-0f1e2d3c.md (+taxonomia: demo-app)</tspan></text>
