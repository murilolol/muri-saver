  <g font-family="ui-monospace,'SF Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="13">
  <text x="18" y="65" xml:space="preserve"><tspan fill="#8b949e"># sessão normal — contexto em 170k já dispara a dica de /compact</tspan></text>
  <text x="18" y="85" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e6edf3">📁 muri-saver</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">🌿 main*</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">🧠 on</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">⏱ 1m 46s</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">◔ 170k/1m </tspan><tspan fill="#e6edf3">▓░░░░░░░ 17%</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">→ considere /compact</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">5h ▓░░░░░░░ 9%</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">→ 3h 41m</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">7d ░░░░░░░░ 0%</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">→ 167h 01m</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">◆ Sonnet 5</tspan></text>
  <text x="18" y="105" xml:space="preserve"></text>
  <text x="18" y="125" xml:space="preserve"><tspan fill="#8b949e"># sessão pesada — cores mudam em 70% (amarelo) e 90% (vermelho)</tspan></text>
  <text x="18" y="145" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e6edf3">📁 api-server</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">🌿 feat/login*</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">🧠 on</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">⏱ 2h 14m 09s</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">▲ </tspan><tspan fill="#3fb950">+412</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#ff7b72">-97</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">◔ 912k/1m </tspan><tspan fill="#ff7b72">▓▓▓▓▓▓▓░ 91%</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">→ /compact ou /clear agora</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#ff7b72">5h ▓▓▓▓▓▓▓▓ 96%</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">→ 12m</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">7d ▓▓▓▓▓░░░ 64%</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">→ 51h 20m</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">◆ Opus 5.5</tspan></text>
  <text x="18" y="165" xml:space="preserve"></text>
  <text x="18" y="185" xml:space="preserve"><tspan fill="#8b949e"># terminal estreito (&lt;120 colunas) — só números, sem barras</tspan></text>
  <text x="18" y="205" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e6edf3">📁 landing-page</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">🌿 main*</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">⏱ 9m</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">◔ 42k/200k </tspan><tspan fill="#e6edf3">21%</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">5h 33%</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">→ 2h 05m</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">7d 12%</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">→ 98h 00m</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">◆ Haiku 4.5</tspan></text>
