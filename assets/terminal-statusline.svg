  <g font-family="ui-monospace,'SF Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="13">
  <text x="18" y="65" xml:space="preserve"><tspan fill="#8b949e"># sessão normal — 🛡 mostra quanto falta pro cache esfriar (55 min sem resposta)</tspan></text>
  <text x="18" y="85" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e6edf3">📁 muri-saver</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">🌿 main*</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">🧠 on</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">⏱ 1m 46s</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">◔ 64k/1m </tspan><tspan fill="#e6edf3">░░░░░░░░ 6%</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">→ tranquilo</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#ffffff">🛡 cache 42m</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">5h ▓░░░░░░░ 9%</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">→ 3h 41m</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">7d ░░░░░░░░ 0%</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">→ 167h 01m</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">◆ Sonnet 5</tspan></text>
  <text x="18" y="105" xml:space="preserve"></text>
  <text x="18" y="125" xml:space="preserve"><tspan fill="#8b949e"># 120k — a cor segue os tokens, não o %: amarelo em 120k, vermelho em 200k</tspan></text>
  <text x="18" y="145" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e6edf3">📁 painel</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">🌿 feat/relatorio*</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">🧠 on</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">⏱ 49m 10s</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">▲ </tspan><tspan fill="#3fb950">+86</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#ff7b72">-14</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">◔ 170k/1m </tspan><tspan fill="#d29922">▓░░░░░░░ 17%</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">→ acompanhe o contexto</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#ff5f5f" font-weight="700">🛡 cache 5m</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">5h ▓▓▓░░░░░ 41%</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">→ 2h 08m</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">7d ▓▓░░░░░░ 23%</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">→ 120h 01m</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">◆ Opus 5.5</tspan></text>
  <text x="18" y="165" xml:space="preserve"></text>
  <text x="18" y="185" xml:space="preserve"><tspan fill="#8b949e"># parada há 1h20 com 212k — o guarda-contexto vai segurar o próximo prompt</tspan></text>
  <text x="18" y="205" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e6edf3">📁 api-server</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">🌿 feat/login*</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">🧠 on</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">⏱ 2h 14m 09s</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">▲ </tspan><tspan fill="#3fb950">+412</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#ff7b72">-97</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">◔ 212k/1m </tspan><tspan fill="#ff7b72">▓▓░░░░░░ 21%</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">→ considere /clear</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#ffffff" font-weight="700" stroke="#d70000" stroke-width="12" stroke-linejoin="round" paint-order="stroke"> CACHE FRIO </tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#ff5f5f" font-weight="700">1h 20min</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#ff7b72">5h ▓▓▓▓▓▓▓▓ 96%</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">→ 12m</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">7d ▓▓▓▓▓░░░ 64%</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">→ 51h 20m</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">◆ Opus 5.5</tspan></text>
  <text x="18" y="225" xml:space="preserve"></text>
  <text x="18" y="245" xml:space="preserve"><tspan fill="#8b949e"># terminal estreito (&lt;120 colunas) — só números, sem barras</tspan></text>
  <text x="18" y="265" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e6edf3">📁 landing-page</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">🌿 main*</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">⏱ 9m</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">◔ 42k/200k </tspan><tspan fill="#e6edf3">21%</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">5h 33%</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">→ 2h 05m</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">7d 12%</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">→ 98h 00m</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#8b949e">│</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#e6edf3">◆ Haiku 4.5</tspan></text>
